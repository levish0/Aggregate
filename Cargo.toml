[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/aggregate-client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Levi Laine <levi.laine.me@gmail.com"]
repository = "https://github.com/levish0/Aggregate"
rust-version = "1.98.0"
description = "An extensible nation simulation with a native Bevy interface"

[workspace.lints.clippy]
too_many_arguments = "allow"
module_inception = "allow"

[workspace.dependencies]
# Internal crates
aggregate-localization = { path = "crates/aggregate-localization" }
aggregate-ui = { path = "crates/aggregate-ui" }
aggregate-world = { path = "crates/aggregate-world" }
aggregate-scenario = { path = "crates/aggregate-scenario" }
aggregate-economy = { path = "crates/aggregate-economy" }
aggregate-simulation-core = { path = "crates/aggregate-simulation-core" }

# External dependencies
# Native 2D rendering and UI. Add 3D features when the first 3D consumer exists.
bevy = { version = "0.19.1", default-features = false, features = ["2d", "ui"] }
bevy_ecs = "0.19.1"
fluent-bundle = "0.16"
unic-langid = "0.9"
bevy_kira_audio = { version = "0.26.0", features = ["mp3", "wav", "ogg"] }
rand = "0.10.2"
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
uuid = { version = "1.26.0", features = ["v7", "v4", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
tracing-appender = "0.2.5"
blake3 = "1.8.7"
zstd = "0.13.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_path_to_error = "0.1.20"
serde_with = "3.22.0"
serde_json = "1.0.151"
serde_json_canonicalizer = "0.3.2"

[profile.dev]
debug = 0
